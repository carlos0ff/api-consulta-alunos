services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DATABASE_URL: mysql://root:${DB_PASSWORD}@db:3306/${DB_NAME}
    ports:
      - "${PORT}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
